<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>استبيان رضا الضيوف | الحريف</title>
<meta name="description" content="شاركنا تقييمك لتجربتك في الحريف">
<meta name="theme-color" content="#241a15">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --walnut:#241a15;      /* الخلفية: خشب مدخّن */
  --ash:#2f231c;         /* أسطح العناصر */
  --ash-2:#3a2c23;       /* الحدود والعناصر غير المفعّلة */
  --copper:#c8834f;      /* لون الشعار */
  --ember:#e7a463;       /* التحديد */
  --bone:#f1e5d6;        /* النص */
  --smoke:#a8968a;       /* النص الثانوي */
  --alert:#e5806b;
  --serif:"Amiri",serif;
  --sans:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--walnut)}
body{font-family:var(--sans);color:var(--bone);font-size:16px;line-height:1.7;min-height:100dvh;
  background:radial-gradient(120% 60% at 50% 0%,#3a271c 0%,var(--walnut) 60%) fixed;
  padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}

/* الترويسة */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.top .mark{width:46px;color:var(--copper)}
.top .mark svg{display:block;width:100%;height:auto}
.stepinfo{font-size:13px;color:var(--smoke);text-align:left}
.stepinfo b{color:var(--bone);font-weight:500}
.progress{height:2px;background:var(--ash-2);border-radius:2px;overflow:hidden;margin-bottom:26px}
.progress i{display:block;height:100%;width:0;background:var(--copper);transition:width .4s ease}

/* شاشة البداية */
.intro{text-align:center;padding:4vh 0 0}
.intro .logo{width:min(230px,58vw);margin:0 auto 26px;color:var(--copper);filter:drop-shadow(0 0 0 rgba(231,164,99,0))}
.intro .logo svg{display:block;width:100%;height:auto}
.intro h1{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.35;margin-bottom:10px}
.intro p{color:var(--smoke);max-width:40ch;margin:0 auto}
.intro .meta{margin-top:18px;font-size:14px;color:var(--smoke)}
@media (prefers-reduced-motion:no-preference){
  .intro .logo{animation:kindle 2.4s ease-out .2s 1 both}
  @keyframes kindle{0%{opacity:0;filter:drop-shadow(0 0 0 rgba(231,164,99,0))}
    45%{opacity:1;filter:drop-shadow(0 0 28px rgba(231,164,99,.55))}
    100%{opacity:1;filter:drop-shadow(0 0 10px rgba(231,164,99,.18))}}
}

/* الأقسام */
.step{display:none}
.step.on{display:block}
.step h2{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.3;margin-bottom:4px}
.step .lede{color:var(--smoke);margin-bottom:26px;font-size:15px}
.q{padding:18px 0;border-top:1px solid var(--ash-2)}
.q:first-of-type{border-top:0;padding-top:0}
.q[hidden]{display:none}
.ql{display:block;font-weight:500;font-size:17px;margin-bottom:12px}
.ql .opt{font-weight:400;font-size:13px;color:var(--smoke);margin-inline-start:6px}
.q.missing .ql{color:var(--alert)}

/* خيارات */
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices label{position:relative}
.choices input{position:absolute;inset:0;opacity:0;cursor:pointer}
.choices span{display:block;padding:9px 16px;border:1px solid var(--ash-2);border-radius:10px;background:var(--ash);font-size:15px;transition:background .15s,border-color .15s,color .15s}
.choices input:checked+span{background:var(--copper);border-color:var(--copper);color:var(--walnut);font-weight:600}
.choices input:focus-visible+span{outline:2px solid var(--ember);outline-offset:2px}

/* مقياس الحرارة: التقييم من ١ إلى ٥ */
.heat{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;direction:rtl}
.heat label{position:relative}
.heat input{position:absolute;inset:0;opacity:0;cursor:pointer}
.heat span{display:block;height:44px;border-radius:4px;background:var(--ash);border:1px solid var(--ash-2);
  text-align:center;line-height:42px;font-size:15px;color:var(--smoke);transition:background .18s,color .18s,border-color .18s}
.heat label:first-child span{border-radius:0 12px 12px 0}
.heat label:last-child span{border-radius:12px 0 0 12px}
.heat .lit span{border-color:transparent;color:var(--walnut);font-weight:600}
.heat .lit.l1 span{background:#7d4a2c}.heat .lit.l2 span{background:#9a5d36}.heat .lit.l3 span{background:#b46f42}
.heat .lit.l4 span{background:var(--copper)}.heat .lit.l5 span{background:var(--ember)}
.heat input:focus-visible+span{outline:2px solid var(--ember);outline-offset:2px}
.heatcap{display:flex;justify-content:space-between;font-size:12px;color:var(--smoke);margin-top:6px}
.heatcap .now{color:var(--ember);font-weight:500}
.na{margin-top:8px;font-size:13px;color:var(--smoke);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.na input{accent-color:var(--copper)}

/* مقياس الترشيح ٠–١٠ */
.nps{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.nps label{position:relative}
.nps input{position:absolute;inset:0;opacity:0;cursor:pointer}
.nps span{display:block;text-align:center;padding:10px 0;border-radius:6px;background:var(--ash);border:1px solid var(--ash-2);font-size:14px}
.nps .lit span{border-color:transparent;color:var(--walnut);font-weight:600;background:var(--c)}
.nps input:focus-visible+span{outline:2px solid var(--ember)}

/* تقييم الأصناف */
.items-rate{margin-top:16px;display:grid;gap:14px}
.items-rate .ir-name{font-size:15px;margin-bottom:6px}

input[type=text],input[type=tel],textarea{width:100%;padding:12px 14px;border:1px solid var(--ash-2);border-radius:10px;background:var(--ash);font-size:16px}
input::placeholder,textarea::placeholder{color:#7e6d62}
input:focus,textarea:focus{outline:none;border-color:var(--copper)}
textarea{min-height:92px;resize:vertical}

/* الأزرار */
.nav{display:flex;gap:10px;margin-top:28px}
.btn{border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:600;cursor:pointer}
.primary{flex:1;background:var(--copper);color:var(--walnut)}
.primary:hover{background:var(--ember)}
.primary:disabled{opacity:.6;cursor:progress}
.ghost{background:transparent;border:1px solid var(--ash-2);color:var(--smoke)}
.err{color:var(--alert);font-size:14px;margin-top:12px;min-height:1.4em}
.trap{position:absolute!important;width:1px!important;height:1px;overflow:hidden;clip:rect(0 0 0 0);border:0;padding:0}

/* الشكر */
.done{text-align:center;padding-top:6vh}
.done .logo{width:120px;margin:0 auto 22px;color:var(--copper)}
.done .logo svg{display:block;width:100%;height:auto}
.done h2{font-size:32px}
.done p{color:var(--smoke);max-width:38ch;margin:6px auto 0}
.reward{margin:26px auto 0;max-width:340px;border:1px dashed var(--copper);border-radius:14px;padding:18px}
.reward strong{display:block;font-family:var(--serif);font-size:26px;color:var(--ember)}
.reward small{color:var(--smoke)}
footer{text-align:center;color:#7e6d62;font-size:12px;margin-top:34px}
@media (max-width:370px){.nps span{font-size:12px;padding:9px 0}.step h2{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top" hidden>
    <div class="mark" data-logo></div>
    <div class="stepinfo" id="stepinfo"></div>
  </div>
  <div class="progress" id="progressbar" hidden><i id="prog"></i></div>

  <form id="f" novalidate autocomplete="on">
    <input class="trap" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <section class="step on intro" id="intro">
      <div class="logo" data-logo></div>
      <h1>نسعد بمشاركتك تقييم تجربتك</h1>
      <p>ملاحظاتك تصل مباشرة إلى إدارة المطعم، وتساعدنا على تقديم تجربة تليق بك في كل زيارة.</p>
      <div class="meta">يستغرق الاستبيان نحو ثلاث دقائق</div>
      <div class="nav"><button type="button" class="btn primary" id="startBtn">ابدأ التقييم</button></div>
    </section>
    <div id="steps"></div>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
    <div class="nav" id="nav" hidden>
      <button type="button" class="btn ghost" id="back">السابق</button>
      <button type="button" class="btn primary" id="next">التالي</button>
    </div>
    <section class="step done" id="done">
      <div class="logo" data-logo></div>
      <h2>شكرًا لك</h2>
      <p>وصل تقييمك إلى إدارة المطعم، وسنأخذ ملاحظاتك بعين الاعتبار.</p>
      <div class="reward" id="reward" hidden></div>
    </section>
  </form>
  <footer>مطعم الحريف</footer>
</div>

   {k:'d_pack', t:'rate', l:'جودة التغليف وحالة الطعام عند الاستلام', req:1},
   {k:'d_courier', t:'rate', l:'لباقة موظف التوصيل', req:1, when:isDelivery},
   {k:'d_complete', t:'choice', l:'هل وصل الطلب كاملًا مع الإضافات (الصلصات، الخبز، المخللات)؟', req:1, o:['نعم','لا، كان هناك نقص']},
 ]},
 {title:'انطباعك العام', lede:'رأيك هنا هو الأهم بالنسبة لنا.', qs:[
   {k:'nps', t:'nps', l:'ما مدى احتمال أن توصي بالحريف لأحد معارفك؟', req:1},
   {k:'return', t:'choice', l:'هل ستزورنا أو تطلب منا مجددًا؟', req:1, o:['بالتأكيد','ربما','لا أظن']},
   {k:'liked', t:'textarea', l:'ما أكثر ما أعجبك؟', ph:'صنف معيّن، موظف، الأجواء…'},
   {k:'improve', t:'textarea', l:'ما الأمر الذي ينبغي أن نحسّنه أولًا؟', ph:'نقرأ كل ملاحظة بعناية'},
   {k:'wish', t:'text', l:'صنف تتمنى أن تراه في قائمتنا'},
   {k:'offers_pref', t:'multi', l:'ما العروض التي تشجّعك على زيارتنا أكثر؟', o:['وجبات عائلية','عروض منتصف الأسبوع','بطاقة ولاء ونقاط','خصم على الزيارة التالية','توصيل مجاني']},
 ]},
 {title:'بيانات التواصل', lede:'نستخدم هذه البيانات للتواصل معك بشأن ملاحظاتك، ولإعلامك بعروض الحريف ومناسباته.', qs:[
   {k:'name', t:'text', l:'الاسم الكامل', ac:'name', req:1},
   {k:'phone', t:'tel', l:'رقم الهاتف المحمول', ac:'tel', ph:'09xxxxxxxx', req:1},
   {k:'area', t:'text', l:'المنطقة أو الحي'},
   {k:'age', t:'choice', l:'الفئة العمرية', o:['أقل من ٢٠','٢٠ – ٢٩','٣٠ – ٣٩','٤٠ – ٤٩','٥٠ فأكثر']},
   {k:'gender', t:'choice', l:'الجنس', o:['ذكر','أنثى']},
   {k:'freq', t:'choice', l:'ما معدّل تناولك الطعام خارج المنزل؟', o:['مرة شهريًا أو أقل','٢ – ٣ مرات شهريًا','مرة أسبوعيًا','أكثر من مرة أسبوعيًا']},
   {k:'bmonth', t:'choice', l:'شهر ميلادك، لتصلك هدية من الحريف بهذه المناسبة', o:['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول']},
   {k:'offers', t:'choice', l:'هل توافق على تلقّي عروض الحريف عبر واتساب؟', o:['نعم، أوافق','لا أوافق']},
 ]},
];

/* ---------- البناء ---------- */
const stepsEl=document.getElementById('steps');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function heat(name){
  return `<div class="heat" role="radiogroup">`+SCALE.map((w,i)=>
    `<label class="h${i+1}"><input type="radio" name="${name}" value="${i+1}" aria-label="${w}"><span>${i+1}</span></label>`).join('')+
    `</div><div class="heatcap"><span>ضعيف</span><span class="now" data-now="${name}"></span><span>ممتاز</span></div>`;
}
function field(q){
  const opt=q.req?'':'<span class="opt">اختياري</span>';
  let h=`<div class="q" data-k="${q.k}"><span class="ql" id="l_${q.k}">${q.l}${opt}</span>`;
  if(q.t==='choice'||q.t==='multi'){
    const type=q.t==='choice'?'radio':'checkbox';
    h+=`<div class="choices" role="${q.t==='choice'?'radiogroup':'group'}" aria-labelledby="l_${q.k}">`+q.o.map(o=>`<label><input type="${type}" name="${q.k}" value="${esc(o)}"><span>${o}</span></label>`).join('')+'</div>';
  } else if(q.t==='rate'){
    h+=heat(q.k);
    if(q.na) h+=`<label class="na"><input type="checkbox" name="${q.k}" value="لا ينطبق" data-na>${q.na}</label>`;
  } else if(q.t==='nps'){
    h+='<div class="nps" role="radiogroup">'+Array.from({length:11},(_,i)=>`<label><input type="radio" name="nps" value="${i}" aria-label="${i}"><span>${i}</span></label>`).join('')+
       '</div><div class="heatcap"><span>غير محتمل إطلاقًا</span><span>محتمل جدًا</span></div>';
  } else if(q.t==='items'){
    h+='<div class="choices" role="group">'+MENU.map(o=>`<label><input type="checkbox" name="items" value="${esc(o)}"><span>${o}</span></label>`).join('')+'</div><div class="items-rate" id="itemsRate"></div>';
  } else if(q.t==='textarea'){
    h+=`<textarea name="${q.k}" aria-labelledby="l_${q.k}" placeholder="${q.ph||''}" maxlength="800"></textarea>`;
  } else {
    h+=`<input type="${q.t==='tel'?'tel':'text'}" name="${q.k}" aria-labelledby="l_${q.k}" ${q.ac?`autocomplete="${q.ac}"`:''} ${q.t==='tel'?'inputmode="tel"':''} placeholder="${q.ph||''}" maxlength="120">`;
  }
  return h+'</div>';
}
STEPS.forEach((s,i)=>{
  stepsEl.insertAdjacentHTML('beforeend',`<section class="step" data-i="${i}"><h2>${s.title}</h2><p class="lede">${s.lede}</p>${s.qs.map(field).join('')}</section>`);
});

const f=document.getElementById('f');
const answers=()=>{const a={};new FormData(f).forEach((v,k)=>{a[k]=a[k]?a[k]+'، '+v:v});return a};

/* مقياس الحرارة: إضاءة الدرجات حتى القيمة المختارة */
function paintHeat(name){
  const v=+(f.querySelector(`[name="${name}"]:checked:not([data-na])`)||{}).value||0;
  f.querySelectorAll(`.heat input[name="${name}"]`).forEach(inp=>{
    const lab=inp.parentElement, n=+inp.value;
    lab.className='h'+n+(n<=v?' lit l'+v:'');
  });
  const cap=f.querySelector(`[data-now="${name}"]`); if(cap) cap.textContent=v?SCALE[v-1]:'';
}
f.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='nps') paintNps();
  if(t.closest('.heat')){const na=f.querySelector(`[name="${t.name}"][data-na]`);if(na)na.checked=false;paintHeat(t.name)}
  if(t.dataset.na!==undefined&&t.checked){f.querySelectorAll(`.heat input[name="${t.name}"]`).forEach(x=>x.checked=false);paintHeat(t.name)}
  if(t.name==='items') renderItems();
  if(t.name==='service') applyWhen();
  const q=t.closest('.q'); if(q) q.classList.remove('missing');
});

/* مقياس الترشيح: إضاءة الدرجات من صفر حتى القيمة المختارة بتدرّج لوني */
function paintNps(){
  const c=f.querySelector('[name=nps]:checked'); const v=c?+c.value:-1;
  const from=[125,74,44], to=[231,164,99];
  f.querySelectorAll('.nps input').forEach(inp=>{
    const n=+inp.value, lab=inp.parentElement, on=n<=v;
    lab.classList.toggle('lit',on);
    if(on){const k=v?n/v:1;lab.style.setProperty('--c',`rgb(${from.map((x,i)=>Math.round(x+(to[i]-x)*(.35+.65*k))).join(',')})`)}
    else lab.style.removeProperty('--c');
  });
}

/* تقييم كل صنف مختار */
function renderItems(){
  const box=document.getElementById('itemsRate');
  const sel=[...f.querySelectorAll('[name=items]:checked')].map(x=>x.value);
  const keep={};box.querySelectorAll('input:checked').forEach(x=>keep[x.name]=x.value);
  box.innerHTML=sel.map((it,i)=>`<div><div class="ir-name">${esc(it)}</div>${heat('item__'+i)}</div>`).join('');
  box.dataset.items=JSON.stringify(sel);
  sel.forEach((it,i)=>{const prev=Object.entries(keep).find(([k])=>k==='item__'+i);if(prev){const x=box.querySelector(`[name="item__${i}"][value="${prev[1]}"]`);if(x)x.checked=true;paintHeat('item__'+i)}});
}

function applyWhen(){
  const a=answers();
  STEPS.forEach((s,i)=>s.qs.forEach(q=>{
    const el=f.querySelector(`.step[data-i="${i}"] .q[data-k="${q.k}"]`);
    el.hidden=q.when?!q.when(a):false;
  }));
}

/* ---------- التنقل ---------- */
const params=new URLSearchParams(location.search);
const els={intro:document.getElementById('intro'),done:document.getElementById('done'),nav:document.getElementById('nav'),top:document.getElementById('top'),pb:document.getElementById('progressbar'),next:document.getElementById('next'),back:document.getElementById('back'),err:document.getElementById('err'),info:document.getElementById('stepinfo')};
let cur=0;
const active=()=>{const a=answers();return STEPS.map((s,i)=>i).filter(i=>!STEPS[i].when||STEPS[i].when(a))};

function show(){
  const list=active(), i=list[cur];
  f.querySelectorAll('#steps .step').forEach(s=>s.classList.toggle('on',+s.dataset.i===i));
  els.info.innerHTML=`<b>${STEPS[i].title}</b><br>الخطوة ${(cur+1).toLocaleString('ar-SY')} من ${list.length.toLocaleString('ar-SY')}`;
  document.getElementById('prog').style.width=((cur+1)/(list.length+1)*100)+'%';
  els.back.hidden=false;
  els.next.textContent=cur===list.length-1?'إرسال التقييم':'التالي';
  els.err.textContent='';
  window.scrollTo({top:0,behavior:'smooth'});
}
function normPhone(p){
  return String(p||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[\s\-()]/g,'').replace(/^(\+|00)963/,'0');
}
function validPhone(p){return /^09\d{8}$/.test(normPhone(p))}
function validate(i){
  const a=answers(); let first=null;
  STEPS[i].qs.forEach(q=>{
    const el=f.querySelector(`.step[data-i="${i}"] .q[data-k="${q.k}"]`);
    if(el.hidden||!q.req) return;
    let ok=!!(a[q.k]&&String(a[q.k]).trim());
    if(q.k==='name'&&ok&&String(a.name).trim().length<3) ok=false;
    if(q.k==='phone'&&ok) ok=validPhone(a.phone);
    if(q.t==='items'&&ok){const n=JSON.parse(document.getElementById('itemsRate').dataset.items||'[]').length;for(let j=0;j<n;j++)if(!a['item__'+j])ok=false}
    el.classList.toggle('missing',!ok); if(!ok&&!first) first=el;
  });
  if(first){els.err.textContent=first.dataset.k==='phone'?'يُرجى إدخال رقم هاتف محمول صحيح يبدأ بـ 09 ويتكوّن من ١٠ أرقام.':'يُرجى الإجابة عن الأسئلة المحددة باللون الأحمر.';first.scrollIntoView({behavior:'smooth',block:'center'});return false}
  return true;
}
document.getElementById('startBtn').onclick=()=>{
  els.intro.classList.remove('on'); els.top.hidden=false; els.pb.hidden=false; els.nav.hidden=false; applyWhen(); show();
};
els.next.onclick=()=>{
  const list=active();
  if(!validate(list[cur])) return;
  if(cur===list.length-1) return send();
  cur++; applyWhen(); show();
};
els.back.onclick=()=>{
  if(cur===0){f.querySelectorAll('#steps .step').forEach(s=>s.classList.remove('on'));els.intro.classList.add('on');els.top.hidden=true;els.pb.hidden=true;els.nav.hidden=true;els.err.textContent='';return}
  cur--; show();
};

/* ---------- الإرسال ---------- */
async function send(){
  els.next.disabled=true; els.next.textContent='جارٍ الإرسال…';
  const a=answers(), body=new URLSearchParams(), list=active();
  const shown=new Set();
  list.forEach(i=>STEPS[i].qs.forEach(q=>{const el=f.querySelector(`.step[data-i="${i}"] .q[data-k="${q.k}"]`);if(!el.hidden)shown.add(q.k)}));
  shown.forEach(k=>{if(k!=='items'&&a[k]!=null)body.append(k,k==='phone'?normPhone(a[k]):String(a[k]).trim())});
  const items=JSON.parse(document.getElementById('itemsRate').dataset.items||'[]');
  body.append('items',items.join('، '));
  body.append('item_ratings',items.map((it,j)=>it+': '+(a['item__'+j]||'')).join(' | '));
  if(a.website) body.append('website',a.website);
  const SRC={t:'طاولة',b:'فاتورة',d:'كيس التوصيل',w:'واتساب',fb:'فيسبوك',ig:'إنستغرام'};
  const sp=params.get('s')||params.get('src')||''; body.append('src',SRC[sp]||sp||'رابط مباشر');
  body.append('table',params.get('t')||'');
  try{
    await fetch(ENDPOINT,{method:'POST',mode:'no-cors',body});
    f.querySelectorAll('#steps .step').forEach(s=>s.classList.remove('on'));
    els.nav.hidden=true; els.top.hidden=true; els.pb.hidden=true;
    if(REWARD){const r=document.getElementById('reward');r.hidden=false;r.innerHTML=`<strong>${REWARD.title}</strong><small>${REWARD.text}</small>`}
    els.done.classList.add('on'); window.scrollTo({top:0});
  }catch(e){
    els.err.textContent='تعذّر إرسال التقييم. تحقّق من اتصالك بالإنترنت ثم أعد المحاولة.';
    els.next.disabled=false; els.next.textContent='إرسال التقييم';
  }
}
</script>
</body>
