  color:var(--teal-br);text-transform:uppercase;text-align:center;margin-bottom:16px}
.name{font-size:clamp(1.85rem,7vw,2.3rem);font-weight:800;text-align:center;color:#fff}
.role{text-align:center;color:var(--teal-br);font-size:.98rem;font-weight:700;margin-top:10px}
.rule{width:60px;height:3px;background:var(--teal);margin:clamp(24px,5vw,30px) auto}

/* لائحة التواصل — بأسلوب قسم "تواصل" بالموقع */
.links{border-top:1px solid var(--hair)}
.row{display:flex;align-items:center;gap:15px;padding:16px 2px;
  border-bottom:1px solid var(--hair);transition:padding-inline-start .2s}
a.row:hover{padding-inline-start:8px}
a.row:hover .v{color:var(--teal-br)}
.ic{flex:0 0 22px;width:22px;height:22px;color:var(--teal);opacity:.9}
.ic svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.txt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.k{font-size:.76rem;color:rgba(255,255,255,.42);font-weight:400}
.v{font-size:.99rem;color:#fff;font-weight:700;direction:ltr;text-align:right;
  unicode-bidi:plaintext;word-break:break-word;transition:color .2s}
.chev{flex:0 0 auto;color:rgba(255,255,255,.25)}
.chev svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* زر حفظ جهة الاتصال — teal ممتلئ متل أزرار الموقع */
.save{margin-top:clamp(26px,6vw,32px)}
.btn-save{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
  padding:17px;font-family:var(--sans);font-size:1rem;font-weight:800;color:#fff;
  background:var(--teal);border:none;border-radius:3px;cursor:pointer;
  transition:background .2s;letter-spacing:.01em}
.btn-save:hover{background:var(--teal-br)}
.btn-save svg{width:20px;height:20px;stroke:#fff;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

.foot{text-align:center;color:rgba(255,255,255,.34);font-size:.74rem;
  margin-top:clamp(24px,5vw,30px);font-family:var(--serif);letter-spacing:.22em}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

/* علاماتنا التجارية */
.brands-head{font-family:var(--serif);font-size:.82rem;letter-spacing:.30em;
  color:var(--teal-br);text-transform:uppercase;text-align:center;
  margin:clamp(30px,6vw,38px) 0 18px;position:relative}
.brands-head::before,.brands-head::after{content:"";position:absolute;top:50%;width:18%;
  height:1px;background:var(--hair)}
.brands-head::before{inset-inline-start:4%}.brands-head::after{inset-inline-end:4%}
.brands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.brand{display:flex;align-items:center;justify-content:center;
  background:#fff;border-radius:8px;aspect-ratio:1;padding:14px;
  transition:transform .18s,box-shadow .18s;text-decoration:none}
a.brand:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.brand img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
@media(max-width:360px){.brands{grid-template-columns:repeat(2,1fr)}}

</style>
</head>
